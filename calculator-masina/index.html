<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator cost mașină lunar | CâtMăCostă.ro</title>
<meta name="description" content="Calculează cât te costă mașina lunar și anual: combustibil, RCA, revizii, anvelope, impozit și alte cheltuieli.">
<link rel="canonical" href="https://cristian060801-dotcom.github.io/CatMaCosta/calculator-masina/">
<link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
<h1>Calculator cost mașină</h1>
<p>Află cât te costă mașina în fiecare lună.</p>
<a href="../">← Înapoi la CâtMăCostă.ro</a>
</header>

<main>

<section class="calculator">

<label>Combustibil lunar (lei)</label>
<input id="combustibil" type="number" value="600">

<label>RCA anual (lei)</label>
<input id="rca" type="number" value="1200">

<label>Revizii și service anual (lei)</label>
<input id="service" type="number" value="1200">

<label>Anvelope anual (lei)</label>
<input id="anvelope" type="number" value="800">

<label>Impozit anual (lei)</label>
<input id="impozit" type="number" value="100">

<label>Alte cheltuieli lunare (lei)</label>
<input id="alte" type="number" value="100">

<button onclick="calculeaza()">Calculează costul</button>

<div id="rezultat"></div>

</section>

<section>
<h2>Cât costă o mașină pe lună?</h2>
<p>Costul real al unei mașini nu înseamnă doar combustibilul. RCA-ul, reviziile, anvelopele, impozitul și reparațiile pot reprezenta o parte importantă din buget.</p>
</section>

</main>

<script>
function calculeaza() {
    const lunar = Number(document.getElementById("combustibil").value)
        + Number(document.getElementById("alte").value);

    const anual = Number(document.getElementById("rca").value)
        + Number(document.getElementById("service").value)
        + Number(document.getElementById("anvelope").value)
        + Number(document.getElementById("impozit").value);

    const totalLunar = lunar + anual / 12;

    document.getElementById("rezultat").innerHTML =
        "<h2>Rezultat</h2>" +
        "<p><strong>Cost lunar estimat: " + totalLunar.toFixed(2) + " lei</strong></p>" +
        "<p>Cost anual estimat: " + (totalLunar * 12).toFixed(2) + " lei</p>";
}
</script>

</body>
</html>
