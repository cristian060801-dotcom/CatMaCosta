<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator taxe | CâtMăCostă.ro</title>
<meta name="description" content="Calculator taxe simplu și gratuit. Calculează rapid valoarea unei taxe procentuale și suma rămasă.">
<link rel="canonical" href="https://cristian060801-dotcom.github.io/CatMaCosta/calculator-taxe/">
<link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
<h1>Calculator taxe</h1>
<p>Calculează rapid o taxă procentuală.</p>
<a href="../">← Înapoi la CâtMăCostă.ro</a>
</header>

<main>

<section class="calculator">

<label>Sumă (lei)</label>
<input id="suma" type="number" value="10000">

<label>Taxă (%)</label>
<input id="taxa" type="number" value="10" step="0.01">

<button onclick="calculeaza()">Calculează taxa</button>

<div id="rezultat"></div>

</section>

<section>
<h2>Cum se calculează o taxă procentuală?</h2>
<p>Valoarea taxei se obține prin înmulțirea sumei cu procentul taxei. Rezultatul este o estimare matematică și nu reprezintă automat o taxă fiscală oficială.</p>
</section>

</main>

<script>
function calculeaza() {
    const suma = Number(document.getElementById("suma").value);
    const taxa = Number(document.getElementById("taxa").value);

    const valoare = suma * taxa / 100;
    const ramas = suma - valoare;

    document.getElementById("rezultat").innerHTML =
        "<h2>Rezultat</h2>" +
        "<p><strong>Taxă: " + valoare.toFixed(2) + " lei</strong></p>" +
        "<p>Sumă rămasă: " + ramas.toFixed(2) + " lei</p>";
}
</script>

</body>
</html>
